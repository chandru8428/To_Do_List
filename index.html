<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1><i class="fas fa-check-circle"></i> To-Do App</h1>
      <p class="subtitle">Stay organized. Get things done.</p>
    </header>

    <main class="main-content">
      <section class="input-section">
        <div class="input-row">
          <input type="text" id="taskInput" class="task-input" placeholder="What needs to be done?" autocomplete="off">
          <button id="addBtn" class="add-btn" title="Add Task">
            <i class="fas fa-plus"></i>
          </button>
        </div>
        <div class="options-row">
          <div class="priority-row">
            <label class="priority-label">Priority:</label>
            <select id="prioritySelect" class="priority-select">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="date-row">
            <label class="date-label">Due Date:</label>
            <input type="date" id="dateInput" class="date-input">
          </div>
        </div>
      </section>

      <section class="filter-section">
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <div class="filter-count">
          <span id="taskCount">0</span> tasks left
        </div>
      </section>

      <section class="tasks-section">
        <ul id="taskList" class="task-list"></ul>
        <div id="emptyState" class="empty-state" style="display:none;">
          <i class="fas fa-clipboard-list"></i>
          <p>No tasks yet. Add one above!</p>
        </div>
      </section>

      <section class="actions-section" id="actionsSection" style="display:none;">
        <button id="clearCompletedBtn" class="action-btn clear-btn">
          <i class="fas fa-trash-alt"></i> Clear Completed
        </button>
        <button id="clearAllBtn" class="action-btn clear-all-btn">
          <i class="fas fa-broom"></i> Clear All
        </button>
      </section>
    </main>

    <footer class="app-footer">
      <p>Double-click a task to edit. Click to toggle complete.</p>
    </footer>
  </div>

  <div id="editModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h2>Edit Task</h2>
      <input type="text" id="editInput" class="task-input" placeholder="Update task...">
      <div class="modal-actions">
        <button id="saveEditBtn" class="add-btn">Save</button>
        <button id="cancelEditBtn" class="cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
